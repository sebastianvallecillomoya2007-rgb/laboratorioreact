<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-labelledby="title desc">
<title id="title">Workflow del radar automático NEXUS Gaming</title><desc id="desc">Inicio, disparador cada 10 segundos, fetch, validación, decisión con caminos de éxito y error, espera, repetición y limpieza al pausar.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 8 3 0 6" fill="#65745b"/></marker></defs>
<rect width="1100" height="1120" fill="#f7faf4"/>
<style>text{font-family:Arial,sans-serif;fill:#24351e;font-size:16px} .small{font-size:13px;fill:#55644a}.title{font-size:27px;font-weight:bold}.box{fill:white;stroke:#91a57e;stroke-width:2}.flow{fill:none;stroke:#65745b;stroke-width:2;marker-end:url(#arrow)}.label{font-size:14px;font-weight:bold}</style>
<text x="60" y="52" class="title">NEXUS / Radar de novedades</text><text x="60" y="80" class="small">Automatización en React · API local + db.json · Ciclo de 10 segundos</text>
<rect x="400" y="112" width="300" height="52" rx="26" fill="#d2edb5" stroke="#6c914a"/><text x="550" y="144" text-anchor="middle">Inicio: montar la aplicación</text>
<path class="flow" d="M550 164V196"/><rect class="box" x="400" y="196" width="300" height="56" rx="8"/><text x="550" y="230" text-anchor="middle">Inactivo: preparar efecto</text>
<path class="flow" d="M550 252V286"/><rect class="box" x="350" y="286" width="400" height="72" rx="8"/><text x="550" y="315" text-anchor="middle" font-weight="bold">Disparador</text><text x="550" y="340" text-anchor="middle" class="small">Montaje · temporizador de 10 s · actualización manual</text>
<path class="flow" d="M550 358V393"/><rect class="box" x="350" y="393" width="400" height="75" rx="8"/><text x="550" y="422" text-anchor="middle" font-weight="bold">En ejecución: fetch /api/products</text><text x="550" y="448" text-anchor="middle" class="small">Leer db.json · timeout de 6 s · validar datos</text>
<path class="flow" d="M550 468V502"/><path d="m550 502 164 83-164 83-164-83Z" fill="#fff2d9" stroke="#b29b61" stroke-width="2"/><text x="550" y="580" text-anchor="middle">¿HTTP correcto y</text><text x="550" y="605" text-anchor="middle">catálogo válido?</text>
<path class="flow" d="M386 585H235V690"/><text x="275" y="574" class="label">Sí</text>
<rect class="box" x="70" y="690" width="330" height="88" rx="8"/><text x="235" y="718" text-anchor="middle">Filtrar últimos 90 días y stock &gt; 0</text><text x="235" y="743" text-anchor="middle" class="small">Ordenar por valoración, fecha e ID</text><text x="235" y="764" text-anchor="middle" class="small">Seleccionar hasta tres productos</text>
<path class="flow" d="M235 778V809"/><rect x="70" y="809" width="330" height="78" rx="8" fill="#e1f1d3" stroke="#7ba056"/><text x="235" y="839" text-anchor="middle" font-weight="bold">Éxito</text><text x="235" y="865" text-anchor="middle" class="small">Actualizar catálogo, ranking, hora e historial</text>
<path class="flow" d="M714 585H850V809"/><text x="782" y="574" class="label">No</text><rect x="690" y="809" width="330" height="78" rx="8" fill="#ffe9e4" stroke="#b88776"/><text x="855" y="839" text-anchor="middle" font-weight="bold">Error</text><text x="855" y="865" text-anchor="middle" class="small">Mostrar causa y conservar últimos datos válidos</text>
<path class="flow" d="M235 887V944H390"/><path class="flow" d="M855 887V944H710"/>
<rect class="box" x="390" y="918" width="320" height="56" rx="8"/><text x="550" y="952" text-anchor="middle">Esperar el siguiente intervalo</text>
<path class="flow" d="M710 950H1052V322H750"/><text x="1040" y="740" text-anchor="end" class="small">Repetir</text><text x="1040" y="760" text-anchor="end" class="small">automáticamente</text>
<rect x="40" y="330" width="257" height="180" rx="9" fill="#eaf0e5" stroke="#91a57e"/><text x="60" y="358" font-weight="bold">Pausar / desmontar</text><text x="60" y="387" class="small">Cancelar intervalos y temporizadores.</text><text x="60" y="411" class="small">Abortar fetch y descartar respuestas tardías.</text><text x="60" y="444" class="small">Pausa: estado Inactivo.</text><text x="60" y="470" class="small">Reanudar: nuevo disparador.</text>
<path class="flow" stroke-dasharray="5 5" d="M350 430H297"/><path class="flow" stroke-dasharray="5 5" d="M168 330V322H350"/>
<text x="60" y="1030" class="small">Simular fallo: una consulta usa /api/demo-error (HTTP 503); el siguiente ciclo vuelve a la ruta normal.</text>
<text x="60" y="1057" class="small">Sin novedades es un éxito con lista vacía. Un candado evita solicitudes simultáneas.</text>
<text x="60" y="1084" class="small">Componentes: RadarPanel, ProductCard, ProductArt y Cart · Lógica: useRadar y catalog.js.</text>
</svg>